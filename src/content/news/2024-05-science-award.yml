date: 2024-05-14
text: "With Haraldur Orri Hauksson, won the University of Iceland Science and Innovation Award, both the Health and Wellbeing category and the overall prize, for automated coding of Icelandic medical records."
text_is: "Við Haraldur Orri Hauksson hlutum Vísinda- og nýsköpunarverðlaun Háskóla Íslands, bæði í flokknum Heilsa og heilbrigði og aðalverðlaunin, fyrir sjálfvirka kóðun íslenskra sjúkraskráa."
