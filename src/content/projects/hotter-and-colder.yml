name: Hotter and Colder
summary: >-
  An Icelandic sentiment corpus of blog comments annotated with nuanced
  labels for sentiment, emotions, toxicity, sarcasm, hate speech,
  sympathy, and related categories. Distributed via the University of
  Iceland, with the companion methodology paper at NoDaLiDa /
  Baltic-HLT 2025.
tags:
  - nlp-is
  - dataset
  - sentiment
status: maintenance
summary_is: >-
  Íslensk málheild athugasemda af bloggsíðum, merkt með fínlegum
  flokkum fyrir viðhorf, tilfinningar, eitrað orðfæri, kaldhæðni,
  hatursorðræðu, samúð og fleira. Háskóli Íslands dreifir henni og
  aðferðagreinin var kynnt á NoDaLiDa / Baltic-HLT 2025.
