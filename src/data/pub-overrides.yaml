einarsson2026icelandicmath:
  theme: nlp-is
  summary: |
    A competitive-mathematics benchmark for large language models in
    Icelandic, built from national maths-competition problems, measuring
    reasoning rather than translation. LREC 2026.
  summary_is: |
    Prófsafn í keppnisstærðfræði fyrir stór mállíkön á íslensku, byggt á
    dæmum úr innlendum stærðfræðikeppnum, sem mælir rökhugsun fremur en
    þýðingargetu. LREC 2026.
  links:
    doi: https://doi.org/10.63317/43xpv5rqyhr6
    pdf: https://lrec.elra.info/lrec2026-main-026

einarsson2026crosslingual:
  theme: nlp-is
  summary: |
    Compares large-language-model mathematical reasoning on Icelandic
    versus English versions of the same problems, isolating the language
    gap from the reasoning task. RESOURCEFUL 2026.
  summary_is: |
    Ber saman stærðfræðilega rökhugsun stórra mállíkana á íslenskum og
    enskum útgáfum sömu dæma og einangrar þannig áhrif tungumálsins frá
    sjálfu rökhugsunarverkefninu. RESOURCEFUL 2026.
  links:
    doi: https://doi.org/10.63317/5gybkk5wzk6g
    pdf: https://lrec.elra.info/lrec2026-ws-resourceful-09

simonsen2026bragd:
  theme: nlp-is
  summary: |
    A constrained multi-label part-of-speech tagger for Faroese that
    enforces valid morphological feature combinations at decoding time.
    LREC 2026.
  summary_is: |
    Skorðaður fjölmerkja-orðflokkamarkari fyrir færeysku sem leyfir aðeins
    gildar samsetningar málfræðilegra formdeilda við afkóðun. LREC 2026.
  links:
    doi: https://doi.org/10.63317/4ibuz9yubt3c
    pdf: https://lrec.elra.info/lrec2026-main-913

simonsen2026entitylinking:
  theme: nlp-is
  summary: |
    Entity linking for Faroese using large language models augmented with
    web search, addressing the sparse knowledge-base coverage of a
    low-resource language. RESOURCEFUL 2026.
  summary_is: |
    Tenging nafnaeininga fyrir færeysku með stórum mállíkönum sem studd
    eru vefleit, til að vega upp á móti því hve takmarkað þekkingargrunnar
    ná yfir tungumál með lítil gögn. RESOURCEFUL 2026.
  links:
    doi: https://doi.org/10.63317/2myt23gboqw3
    pdf: https://lrec.elra.info/lrec2026-ws-resourceful-04

stenlund2026synthetic:
  theme: nlp-is
  summary: |
    Examines when synthetic instruction data helps instruction-tuning for
    low-resource Nordic languages, and where it breaks down. LREC 2026.
  summary_is: |
    Skoðar hvenær tilbúin fyrirmælagögn gagnast við fyrirmælaþjálfun
    (instruction tuning) fyrir norræn tungumál með lítil gögn og hvar þau
    bregðast. LREC 2026.
  links:
    doi: https://doi.org/10.63317/3e73sy24wup3
    pdf: https://lrec.elra.info/lrec2026-main-838

simonsen2026reformulate:
  theme: nlp-is
  summary: |
    Argues for reformulating and authoring prompts natively rather than
    translating them, yielding more natural evaluation data for
    underserved languages. LREC 2026.
  summary_is: |
    Færir rök fyrir því að umorða og semja fyrirmæli beint á viðkomandi
    tungumáli í stað þess að þýða þau, sem skilar eðlilegri matsgögnum
    fyrir tungumál sem hafa setið á hakanum. LREC 2026.
  links:
    doi: https://doi.org/10.63317/4kz5jrk3j9kw
    pdf: https://lrec.elra.info/lrec2026-main-841

olafsdottir2026understanding:
  theme: clinical-ai
  summary: |
    Nation-wide study of why guideline-directed medical therapy goes
    unprescribed in acute heart failure with advanced kidney disease,
    using the Icelandic Heart Failure Registry. European Journal of Heart
    Failure.
  summary_is: |
    Rannsókn á landsvísu á því hvers vegna lyfjameðferð samkvæmt klínískum
    leiðbeiningum er ekki ávísað við bráða hjartabilun samfara langt
    gengnum nýrnasjúkdómi, með gögnum úr íslensku hjartabilunarskránni.
    European Journal of Heart Failure.

einarsson2026validating:
  theme: nlp-is
  summary: |
    Validates LLM-generated multiple-choice exam questions against the
    performance of students who sat them in a graded university exam.
    Self-assigned difficulty labels predicted performance only weakly,
    and generated items still needed expert review. CELDA 2026, best paper
    award.
  summary_is: |
    Sannreynir krossaspurningar sem stórt mállíkan samdi með því að bera
    þær saman við frammistöðu nemenda sem þreyttu þær í háskólaprófi sem
    gilti til einkunnar. Erfiðleikastigið sem líkanið gaf spurningunum
    sjálft spáði aðeins veiklega fyrir um frammistöðu og spurningarnar
    þurftu eftir sem áður yfirlestur sérfræðinga. CELDA 2026, verðlaun
    fyrir bestu grein ráðstefnunnar.
  notes: Best paper award, CELDA 2026

rutsdottir2026grading:
  theme: nlp-is
  summary: |
    An exploratory study of whether large language models can apply an
    explicit rubric to free-text exam answers consistently enough to
    support human graders. The models tracked rubric-based instructor
    grades closely but were the strictest raters. CELDA 2026.
  summary_is: |
    Könnunarrannsókn á því hvort stór mállíkön geti beitt skýrum
    matskvarða á skrifleg prófsvör af nægri samkvæmni til að styðja við
    yfirferð kennara. Einkunnir líkananna fylgdu vel einkunnum kennara sem
    notuðu matskvarðann, en líkönin gáfu lægstu einkunnirnar. CELDA 2026.

einarsson2026bloom:
  theme: nlp-is
  summary: |
    Compares the Bloom levels and difficulty labels that an LLM assigns to
    its own exam items with human raters, separate "cold" model ratings and
    student performance. Self-assigned labels describe the request rather
    than the item. CELDA 2026.
  summary_is: |
    Ber saman Bloom-stig og erfiðleikamerki sem stórt mállíkan gefur eigin
    prófspurningum við mat manna, sérstakt „kalt“ mat líkans og
    frammistöðu nemenda. Merkin sem líkanið gefur sjálft lýsa beiðninni
    fremur en spurningunni. CELDA 2026.

einarsson2026beyond:
  theme: nlp-is
  selected: true
  summary: |
    Revisits the findings of the IceBERT paper with the ModernBERT
    architecture, training Icelandic encoders from 12M to 1B parameters on
    9B tokens of open data and benchmarking 30 encoders on eleven tasks
    under one protocol. The 1B model, to our knowledge the first
    monolingual Icelandic encoder of its size, is significantly better
    than IceBERT on every task when trained from scratch; warm-started
    from the English Ettin encoder, it scores best of all encoders on
    every ranked task. Because the model shapes match Ettin and mmBERT,
    the paper also tests warm starts under controlled conditions: with the
    Icelandic vocabulary transplanted, a warm start was never
    significantly worse than training from scratch. Single-author arXiv
    preprint, with all models released on Hugging Face.
  summary_is: |
    Endurskoðar niðurstöður IceBERT-greinarinnar með ModernBERT-högun:
    íslenskir kóðarar frá 12 milljónum upp í milljarð stika eru þjálfaðir
    á 9 milljörðum tóka af opnum gögnum og 30 kóðarar bornir saman á
    ellefu verkefnum með sömu aðferð. Milljarðs stika líkanið, að því er
    best er vitað fyrsti eintyngdi íslenski kóðarinn af þeirri stærð, er
    marktækt betra en IceBERT á öllum verkefnunum þegar það er þjálfað frá
    grunni, og frumstillt með enska Ettin-kóðaranum nær það bestu
    niðurstöðu allra kóðara á hverju verkefni. Þar sem lögun líkananna
    passar við Ettin og mmBERT er einnig hægt að prófa frumstillingu við
    stýrðar aðstæður: með íslenskan orðaforða ígræddan var frumstilling
    aldrei marktækt verri en þjálfun frá grunni. Forprent á arXiv (eini
    höfundur) og öll líkönin eru aðgengileg á Hugging Face.
  links:
    arxiv: https://arxiv.org/abs/2610.36230
    huggingface: https://huggingface.co/collections/hafsteinn/icelandic-modernbert
