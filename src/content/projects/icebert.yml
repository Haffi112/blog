name: IceBERT family
summary: >-
  A family of Icelandic BERT-style language models pre-trained on the
  Icelandic Crawled Corpus. Released alongside the LREC 2022 paper with
  Miðeind, the IceBERT checkpoints have become the foundation for much
  of the subsequent Icelandic NLP work in our group and elsewhere.
links:
  huggingface: https://huggingface.co/mideind/IceBERT
tags:
  - nlp-is
  - language-model
status: maintenance
summary_is: >-
  Fjölskylda íslenskra BERT-mállíkana sem voru forþjálfuð á Íslensku
  vefmálheildinni (Icelandic Crawled Corpus). IceBERT-líkönin komu út
  með grein á LREC 2022 í samstarfi við Miðeind og hafa síðan verið
  grunnurinn að stórum hluta íslenskrar máltæknivinnu, bæði í hópnum
  okkar og annars staðar.
name_is: "IceBERT-líkönin"
