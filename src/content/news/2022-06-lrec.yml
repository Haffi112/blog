text: "Two papers at LREC 2022 in Marseille: Natural Questions in Icelandic, and a recipe for good language models from a clean crawled corpus (the IceBERT paper)."
text_is: "Tvær greinar á LREC 2022 í Marseille: Natural Questions in Icelandic og uppskrift að góðum mállíkönum úr hreinsuðu vefsafni (IceBERT-greinin)."
