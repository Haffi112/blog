date: 2025-03-01
text: "Three papers at NoDaLiDa/Baltic-HLT 2025: the Hotter and Colder sentiment corpus for Icelandic, and two studies of machine translation for Faroese."
text_is: "Þrjár greinar á NoDaLiDa/Baltic-HLT 2025: lyndisgagnasafnið Hotter and Colder fyrir íslensku og tvær rannsóknir á vélþýðingum fyrir færeysku."
