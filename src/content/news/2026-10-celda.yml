date: 2026-10-26
text: "Received the best paper award at CELDA 2026 in Lisbon for “Validating LLM-Generated Exam Questions Against Student Performance”, written with Sigrún Helga Lund. Presented two papers at the conference and co-authored a third."
text_is: "Hlaut verðlaun fyrir bestu grein ráðstefnunnar CELDA 2026 í Lissabon, „Validating LLM-Generated Exam Questions Against Student Performance“, sem við Sigrún Helga Lund skrifuðum. Kynnti tvær greinar á ráðstefnunni og var meðhöfundur að þeirri þriðju."
link: /publications/
link_is: /is/publications/
