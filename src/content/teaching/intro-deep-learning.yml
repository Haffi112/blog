title: Introduction to Deep Learning
level: msc
language: english
semesters:
  - Fall 2025
description: >-
  Master's introduction to deep neural networks, covering
  backpropagation, model training and regularisation, and
  architectures used for image, audio, and text. Generative,
  adversarial, and sequential models are part of the syllabus, with
  PyTorch as the implementation language throughout. Students
  present a paper or project of their own from the field as part of
  the assessment. Taught in English.
