title: Computers, Operating Systems and Digital Literacy
level: bsc
language: mixed
semesters: []
description: >-
  Self-study BSc course developed in 2020 and modelled on MIT's
  "Missing Semester of your CS Education". Covers computer
  organisation, operating-systems basics, and the command-line and
  tooling skills students need across the rest of the degree.
  Designed for both Icelandic and international students to work
  through at their own pace.
