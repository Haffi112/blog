date: 2023-11-01
text: "The EU-funded TrustLLM project began: eleven partners building trustworthy language models for Germanic languages, with the University of Iceland and Miðeind among them."
text_is: "TrustLLM, verkefni sem Evrópusambandið styrkir, fór af stað: ellefu samstarfsaðilar smíða traust mállíkön fyrir germönsk mál og Háskóli Íslands og Miðeind eru þar á meðal."
link: https://mideind.is/trustllm.html
