date: 2025-01-01
text: "Four MSc students graduated: Alexander Guðmundsson, Joao Rodrigo Da Silva Martins, Margrét Snorradóttir and Steinar Bragi Sigurðarson. Joao continued to a PhD with me, in collaboration with the Marine and Freshwater Research Institute."
text_is: "Fjórir meistaranemar brautskráðust: Alexander Guðmundsson, Joao Rodrigo Da Silva Martins, Margrét Snorradóttir og Steinar Bragi Sigurðarson. Joao hélt áfram í doktorsnám hjá mér í samstarfi við Hafrannsóknastofnun."
