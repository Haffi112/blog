text: "New paper on curated retrieval versus open web search in public AI services, and how source trustworthiness holds up in each (arXiv preprint)."
link: https://arxiv.org/abs/2607.05217
text_is: "Ný grein þar sem borið er saman hvort opinberar gervigreindarþjónustur sæki efni í valin heimildasöfn eða leiti á opnum vef, og hversu traustar heimildirnar reynast í hvoru tilviki (forprent á arXiv)."
