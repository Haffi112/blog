title: Introduction to Deep Learning
level: msc
language: english
semesters:
  - Fall 2025
description: >-
  Master's introduction to deep neural networks, covering
  backpropagation, model training and regularisation, and
  architectures used for image, audio, and text. Generative,
  adversarial, and sequential models are part of the syllabus, with
  PyTorch as the implementation language throughout. Students
  present a paper or project of their own from the field as part of
  the assessment. Taught in English.
title_is: "Inngangur að djúpnámi"
description_is: >-
  Inngangsnámskeið á meistarastigi um djúp tauganet: bakdreifingu,
  þjálfun og reglun líkana og högun sem notuð er fyrir myndir, hljóð
  og texta. Spunalíkön, gagnstæð líkön og runulíkön eru hluti af
  námsefninu og PyTorch er notað við alla útfærslu. Nemendur kynna
  grein eða eigið verkefni á sviðinu sem hluta af námsmatinu. Kennt á
  ensku.
