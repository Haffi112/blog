date: 2024-11-12
text: "New paper in Nature Communications from deCODE: sequence variants associated with BMI affect disease risk through BMI itself."
text_is: "Ný grein í Nature Communications frá Íslenskri erfðagreiningu: erfðabreytileikar sem tengjast líkamsþyngdarstuðli hafa áhrif á sjúkdómsáhættu í gegnum stuðulinn sjálfan."
link: https://doi.org/10.1038/s41467-024-53568-9
