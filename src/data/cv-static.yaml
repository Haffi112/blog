research_statement: >-
  My PhD at ETH Zurich centred on mathematical models of neural systems,
  drawing on probability theory, distributed computing, and differential
  equations. After a postdoc in systems neuroscience and two years as a
  data scientist in banking, I joined the University of Iceland in 2020
  and built a research group on natural-language processing for
  low-resource languages, with a focus on Icelandic and other
  North-Germanic languages. My group has contributed Icelandic language
  models, methods for automated clinical coding, gender-bias evaluation
  for morphologically gendered languages, sentiment annotation for
  Icelandic blog comments, and machine-translation resources for Faroese.

