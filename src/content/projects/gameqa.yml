name: GameQA
summary: >-
  A gamified mobile-app platform for crowdsourcing multi-domain
  question-answering datasets. Demonstrated at EACL 2023 System
  Demonstrations and used to collect the RUQuAD-1 reading-comprehension
  dataset for Icelandic.
tags:
  - nlp-is
  - tool
  - qa
status: maintenance
summary_is: >-
  Leikjavætt smáforrit til að safna gagnasöfnum fyrir spurningasvörun
  á mörgum sviðum með hjálp almennings. Kynnt á EACL 2023 System
  Demonstrations og notað til að safna RUQuAD-1,
  lesskilningsgagnasafni fyrir íslensku.
