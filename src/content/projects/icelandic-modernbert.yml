status: active
summary_is: >-
  ModernBERT-líkön fyrir íslensku frá 12 milljónum upp í milljarð stika,
  þjálfuð á 9 milljörðum tóka af opnum gögnum: stærðarröð líkana sem eru
  þjálfuð frá grunni og líkönin úr rannsókninni á frumstillingu, alls 34
  líkön með MIT-leyfi. Milljarðs stika líkanið, að því er best er vitað
  fyrsti eintyngdi íslenski kóðarinn af þeirri stærð, er marktækt betra
  en IceBERT á öllum ellefu prófunarverkefnunum. Gefið út samhliða
  forprenti á arXiv árið 2026.
name_is: "ModernBERT-líkön fyrir íslensku"
