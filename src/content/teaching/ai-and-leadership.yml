title: AI and Leadership
level: msc
language: icelandic
semesters:
  - "2025"
  - "2026"
description: >-
  Course in the Executive MBA programme at the University of Iceland
  on artificial intelligence for working leaders. Participants learn
  what current AI systems can and cannot do, where AI is useful in
  the everyday work of leadership (data, decision-making, employee
  performance and well-being, and the leader's own development), and
  what ethical questions come with putting AI to work inside a
  business. Classes include direct work with generative AI tools.
  Co-taught in 2025 with Sigrún Gunnarsdóttir, a servant-leadership
  researcher; taught alone in 2026. In Icelandic.
title_is: "Gervigreind og forysta"
description_is: >-
  Námskeið í Executive MBA-námi við Háskóla Íslands um gervigreind
  fyrir stjórnendur. Þátttakendur kynnast því hvað gervigreindarkerfi
  nútímans geta og geta ekki, hvar gervigreind nýtist í daglegu starfi
  stjórnenda (gögn, ákvarðanataka, frammistaða og vellíðan starfsfólks
  og eigin þróun stjórnandans) og hvaða siðferðilegu spurningar vakna
  þegar gervigreind er tekin í notkun innan fyrirtækja. Í tímum er
  unnið beint með spunagreindartól. Árið 2025 kenndi ég námskeiðið með
  Sigrúnu Gunnarsdóttur, sem rannsakar þjónandi forystu, en einn árið
  2026. Kennt á íslensku.
