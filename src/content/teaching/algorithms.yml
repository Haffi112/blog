title: Analysis of Algorithms
level: mixed
language: english
semesters:
  - Spring 2021
  - Spring 2023
  - Spring 2025
description: >-
  Algorithm design and analysis, taught as a bridge course between
  the BSc and MSc programmes in computer science. Covers asymptotic
  complexity, algorithms for sorting and searching, graph algorithms
  and matrix computation, and the standard design strategies of
  divide-and-conquer, greedy methods, and dynamic programming. The
  course closes with the basics of intractability: NP-completeness,
  approximation algorithms, and randomised algorithms. Co-taught with
  Steinn Guðmundsson and Páll Melsted on a rotating basis. Taught in
  English.
title_is: "Greining reiknirita"
description_is: >-
  Hönnun og greining reiknirita, kennd sem brúarnámskeið milli BS- og
  MS-náms í tölvunarfræði. Fjallað er um tímaflækju, reiknirit fyrir
  röðun og leit, reiknirit á netum og fylkjareikninga og hefðbundnar
  hönnunaraðferðir: deila og drottna, gráðug reiknirit og kvika
  bestun. Námskeiðinu lýkur á grunnatriðum torleystra verkefna:
  NP-fullkomleika, nálgunarreikniritum og slembireikniritum. Kennt til
  skiptis með Steini Guðmundssyni og Páli Melsted. Kennt á ensku.
