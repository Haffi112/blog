name: MIM-GOLD-EL
summary: >-
  An entity-linking corpus for Icelandic built on top of the MIM-GOLD
  named-entity collection. Released with the University of Iceland and
  introduced at LREC 2022; the companion methodology paper appeared at
  the Dataset Creation for Lower-Resourced Languages workshop.
tags:
  - nlp-is
  - dataset
  - entity-linking
status: maintenance
summary_is: >-
  Málheild fyrir einingatengingu (entity linking) á íslensku, byggð
  ofan á MIM-GOLD-málheildinni þar sem sérnöfn eru mörkuð. Gefin út
  með Háskóla Íslands og kynnt á LREC 2022; aðferðagreinin birtist á
  vinnustofunni Dataset Creation for Lower-Resourced Languages.
