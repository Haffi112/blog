title: The AI Lifecycle
level: msc
language: english
semesters:
  - Spring 2021
  - Spring 2022
  - Spring 2023
  - Spring 2024
  - Spring 2025
  - Spring 2026
description: >-
  Master's course on the full lifecycle of a production AI system:
  gathering and preparing data, feature selection, training models,
  evaluating them, putting them into production, serving them as
  services, and monitoring and maintaining them once live. The
  semester is built around three larger team projects in which
  student teams compete to build the best working solution.
title_is: "Lífsferill gervigreindarlausna"
description_is: >-
  Meistaranámskeið um allan lífsferil gervigreindarkerfis í rekstri:
  söfnun og undirbúning gagna, val á breytum, þjálfun og mat líkana,
  innleiðingu, framsetningu sem þjónustu og vöktun og viðhald eftir að
  kerfið er komið í notkun. Misserið hverfist um þrjú stærri
  hópverkefni þar sem nemendahópar keppa um að smíða bestu lausnina.
