# Bibliography overrides keyed by bibtex citation id.
# Schema per entry (all fields optional):
#   theme: nlp-is | cv-nat | clinical-ai | genetics | comp-neuro
#   summary: 1-2 sentence summary (3-4 for selected)
#   selected: boolean (featured at top of publications page)
#   links: { doi, arxiv, pdf, code, huggingface, dataset }
#   notes: free text, e.g. "corresponding author"
#
# Task 7 populates this file with entries for all 72 bibtex ids.

# === Computational neuroscience and probabilistic combinatorics (PhD-era) ===

einarsson2014high:
  theme: comp-neuro
  summary: |
    A high-capacity model for one-shot associative learning in cortical
    networks, showing how sparse-coding regimes extend the classical
    Hopfield capacity bound. Published in Frontiers in Computational
    Neuroscience.
  summary_is: |
    Líkan með mikla geymslurýmd fyrir tengslanám af einu dæmi (one-shot) í
    netum heilabarkar, sem sýnir hvernig strjál kóðun víkkar út hið
    klassíska rýmdarmark Hopfield-neta. Birt í Frontiers in Computational
    Neuroscience.

einarsson2017model:
  theme: comp-neuro
  summary: |
    Proposes a model of fast Hebbian spike-latency normalization, in
    which timing-dependent plasticity rapidly equalises spike latencies
    across a population. Frontiers in Computational Neuroscience.
  summary_is: |
    Setur fram líkan af hraðri stöðlun á seinkun taugaboða samkvæmt
    lögmáli Hebbs, þar sem tímaháð taugamótamýkt jafnar seinkunina hratt
    innan hóps taugafrumna. Frontiers in Computational Neuroscience.

weissenberger2017long:
  theme: comp-neuro
  summary: |
    Shows that long synfire chains can emerge from spike-timing dependent
    plasticity modulated by population activity, providing a mechanistic
    account of stable sequence representations. International Journal of
    Neural Systems.
  summary_is: |
    Sýnir að langar keðjur af gerðinni „synfire chain“ geta myndast með
    tímaháðri taugamótamýkt (STDP) sem stýrist af virkni
    taugafrumuþýðisins, og skýrir þannig hvernig stöðug framsetning runa
    getur orðið til. International Journal of Neural Systems.

einarsson2017fast:
  theme: comp-neuro
  summary: |
    PhD thesis (ETH Zurich) on the fast emergence of neural structures.
    Develops mathematical models of how cortical assemblies, synfire
    chains, and other functional structures can self-organise rapidly
    from spiking dynamics and local plasticity rules.
  summary_is: |
    Doktorsritgerð (ETH Zurich) um hraða myndun formgerða í tauganetum.
    Þróar stærðfræðileg líkön af því hvernig frumusamstæður í heilaberki,
    keðjur af gerðinni „synfire chain“ og aðrar starfrænar formgerðir geta
    skipulagst hratt af sjálfu sér út frá taugaboðavirkni og staðbundnum
    mýktarreglum.

matheus2018hippocampal:
  theme: comp-neuro
  summary: |
    Presents a hippocampal model for behavioral time acquisition and
    fast bidirectional replay of spatio-temporal memory sequences.
    Frontiers in Neuroscience.
  summary_is: |
    Setur fram líkan af drekanum (hippocampus) sem skýrir hvernig
    tímalengdir í hegðun lærast og hvernig rúm- og tímaháðar minnisrunur
    eru endurspilaðar hratt í báðar áttir. Frontiers in Neuroscience.

einarsson2018linear:
  theme: discrete-math
  summary: |
    Analyses the (1+1) evolutionary algorithm on the linear hidden subset
    problem with scheduled and adaptive mutation rates. GECCO 2018
    proceedings.
  summary_is: |
    Greinir (1+1) þróunarreikniritið á línulega falda hlutmengisverkefninu
    (linear hidden subset problem), þar sem stökkbreytingatíðnin fylgir
    ýmist fyrirfram gefinni áætlun eða aðlagast jafnóðum. Ráðstefnurit
    GECCO 2018.

weissenberger2018origin:
  theme: comp-neuro
  summary: |
    Investigates the origin of lognormal network synchrony in CA1,
    relating heavy-tailed firing distributions to recurrent network
    structure. Hippocampus journal.
  summary_is: |
    Kannar uppruna lognormal-dreifðrar samstillingar í tauganeti
    CA1-svæðisins og tengir halaþungar dreifingar boðtíðni við formgerð
    endurkvæmra tenginga í netinu. Tímaritið Hippocampus.

einarsson2019bootstrap:
  theme: discrete-math
  summary: |
    Studies bootstrap percolation on random graphs in the presence of
    inhibitory vertices, a generalisation of the classical activation
    cascade model motivated by cortical excitation-inhibition balance.
    Introduces a probabilistic framework that captures how the addition
    of inhibition shifts the activation threshold and the size of the
    final active set. Published in Random Structures & Algorithms, a
    premier journal in probabilistic combinatorics; one of the key
    results of the author's PhD.
  summary_is: |
    Rannsakar bootstrap percolation á slembinetum með hamlandi hnútum, en
    það er alhæfing á klassísku líkani fyrir útbreiðslu virkjunar sem
    sækir innblástur í jafnvægi örvunar og hömlunar í heilaberki. Kynnir
    líkindafræðilegan ramma sem lýsir því hvernig hömlun hliðrar
    virkjunarþröskuldinum og breytir stærð lokamengis virkra hnúta. Birt í
    Random Structures & Algorithms, einu fremsta tímariti á sviði
    líkindafræðilegrar fléttufræði; ein af meginniðurstöðum
    doktorsverkefnis höfundar.
  links:
    doi: https://doi.org/10.1002/rsa.20882
    arxiv: https://arxiv.org/abs/1410.3291

lengler2016connectivity:
  theme: discrete-math
  summary: |
    Establishes connectivity thresholds for bounded-size rules in random
    graph processes, a contribution to the theory of Achlioptas-style
    edge-selection processes. Annals of Applied Probability.
  summary_is: |
    Ákvarðar samhengisþröskulda fyrir stærðartakmarkaðar reglur
    (bounded-size rules) í slembinetaferlum og er framlag til kenninga um
    leggjavalsferli af Achlioptas-gerð. Annals of Applied Probability.

porterhippocam:
  theme: comp-neuro
  summary: |
    Conference contribution related to hippocampal modelling
    (collaboration with the Hippocam consortium).
  summary_is: |
    Ráðstefnuframlag um líkanagerð af drekanum (hippocampus), unnið í
    samstarfi við Hippocam-rannsóknarhópinn.

# === Icelandic and Faroese NLP / language models ===

snaebjarnarson2022natural:
  theme: nlp-is
  summary: |
    Introduces Natural Questions in Icelandic (NQiI), an open-domain
    question answering dataset adapted from the English Natural
    Questions benchmark. Published at LREC 2022.
  summary_is: |
    Kynnir Natural Questions in Icelandic (NQiI), gagnasafn fyrir
    spurningasvörun á opnu sviði sem byggir á enska prófsafninu Natural
    Questions. Birt á LREC 2022.
  links:
    pdf: https://aclanthology.org/2022.lrec-1.477/

snaebjarnarson2022nqii:
  theme: nlp-is
  summary: |
    NQiI v1.1 dataset release - an updated version of the Icelandic
    Natural Questions QA dataset with additional annotations. Distributed
    via the University of Iceland.
  summary_is: |
    NQiI v1.1: uppfærð útgáfa íslenska Natural Questions-gagnasafnsins
    fyrir spurningasvörun, með viðbótarmerkingum. Dreift af Háskóla
    Íslands.

snaebjarnarson2022icelandic:
  theme: nlp-is
  summary: |
    Icelandic WinoGrande v1.0 - an Icelandic adaptation of the WinoGrande
    commonsense reasoning benchmark, intended for evaluating Icelandic
    language models. Released by Miðeind ehf.
  summary_is: |
    Icelandic WinoGrande v1.0: íslensk aðlögun á WinoGrande-prófsafninu
    fyrir ályktanir byggðar á almennri skynsemi, ætluð til að meta íslensk
    mállíkön. Gefið út af Miðeind ehf.

snaebjarnarson2022warm:
  theme: nlp-is
  selected: true
  summary: |
    Foundational paper for the Icelandic language-model line at the
    University of Iceland / Miðeind. Demonstrates that warm-starting a
    Transformer encoder from multilingual weights and continuing
    pre-training on a carefully cleaned Icelandic web corpus yields
    strong downstream performance with far less compute than training
    from scratch. The cleaned crawl and the IceBERT model released
    alongside the paper became the basis for much of the subsequent
    Icelandic NLP work in this collection. LREC 2022.
  summary_is: |
    Grunngreinin í íslensku mállíkanaröðinni hjá Háskóla Íslands og
    Miðeind. Sýnir að þegar Transformer-kóðari er frumstilltur með
    fjöltyngdum vigtum (warm-start) og forþjálfun haldið áfram á vandlega
    hreinsaðri íslenskri vefmálheild næst góður árangur í afleiddum
    verkefnum með mun minna reikniafli en þjálfun frá grunni krefst.
    Hreinsaða vefsöfnunin og IceBERT-líkanið, sem gefin voru út samhliða
    greininni, urðu grunnurinn að stórum hluta þeirra íslensku
    máltækniverkefna sem á eftir fylgdu í þessu safni. LREC 2022.
  links:
    pdf: https://aclanthology.org/2022.lrec-1.464/

fridhriksdottir2022mim:
  theme: nlp-is
  summary: |
    Release of MIM-GOLD-EL (version 22.01), an entity-linking corpus for
    Icelandic built on top of the MIM-GOLD named-entity collection.
    University of Iceland.
  summary_is: |
    MIM-GOLD-EL (útgáfa 22.01) er íslensk málheild fyrir tengingu
    nafnaeininga, byggð á nafnaeiningamerkingum MIM-GOLD-safnsins. Háskóli
    Íslands.

snaebjarnarson2022cross:
  theme: nlp-is
  summary: |
    Uses cross-lingual question answering as a stepping stone for
    monolingual open-domain QA in Icelandic, showing that English
    retrieval+QA pipelines can be adapted with limited Icelandic
    supervision. Workshop on Multilingual Information Access (MIA).
  summary_is: |
    Nýtir spurningasvörun þvert á tungumál sem stökkpall að eintyngdri
    spurningasvörun á opnu sviði á íslensku og sýnir að aðlaga má ensk
    leitar- og svörunarkerfi með takmörkuðum íslenskum þjálfunargögnum.
    Workshop on Multilingual Information Access (MIA).

fridhriksdottir2022fridhriksdottir:
  theme: nlp-is
  summary: |
    Master's-style write-up of "Bootstrapping Icelandic Knowledge Graph
    Data" (University of Amsterdam), a precursor to the ESSLLI
    proceedings paper of the same title.
  summary_is: |
    Ritgerð á meistarastigi, „Bootstrapping Icelandic Knowledge Graph
    Data“ (Amsterdamháskóli), og undanfari samnefndrar greinar í
    ráðstefnuriti ESSLLI.

fridhriksdottir2022fictionary:
  theme: nlp-is
  summary: |
    Proposes fictionary-style games as a low-cost mechanism for
    crowdsourcing language resources, with experiments on Icelandic.
    Workshop on Novel Incentives in Data Collection at LREC 2022.
  summary_is: |
    Leggur til orðabókarleiki á borð við fictionary sem ódýra leið til að
    safna málföngum frá almenningi, með tilraunum á íslensku. Workshop on
    Novel Incentives in Data Collection á LREC 2022.

steinunn2022building:
  theme: nlp-is
  summary: |
    Describes the construction of an Icelandic entity-linking corpus,
    detailing annotation guidelines and inter-annotator agreement.
    Dataset Creation for Lower-Resourced Languages workshop at LREC 2022.
  summary_is: |
    Lýsir smíði íslenskrar málheildar fyrir tengingu nafnaeininga og
    fjallar ítarlega um mörkunarleiðbeiningar og samræmi milli markara.
    Vinnustofan Dataset Creation for Lower-Resourced Languages á LREC
    2022.

sigurdhardottir2023otolith:
  theme: cv-nat
  selected: true
  summary: |
    Few-shot computer-vision method for fish-age determination from
    otolith images. The pipeline combines a lightweight feature
    extractor with a few-shot classifier, achieving accuracy comparable
    to expert age readings while requiring only a handful of labelled
    examples per age class. Demonstrated on Atlantic cod otoliths and
    designed to lower the cost of routine stock-assessment work at
    fisheries laboratories. Published in Ecological Informatics.
  summary_is: |
    Tölvusjónaraðferð sem lærir af fáum dæmum (few-shot) til
    aldursgreiningar fiska út frá myndum af kvörnum. Ferlið tengir saman
    léttan eiginleikaútdrátt og flokkara sem lærir af fáum dæmum og nær
    nákvæmni sem jafnast á við aldurslestur sérfræðinga, þótt aðeins fá
    merkt dæmi séu fyrir hvern aldursflokk. Aðferðin var prófuð á kvörnum
    úr þorski og er hönnuð til að lækka kostnað við reglubundið stofnmat á
    rannsóknarstofum í fiskifræði. Birt í Ecological Informatics.
  links:
    doi: https://doi.org/10.1016/j.ecoinf.2023.102046

davidhsson2023efficient:
  theme: cv-nat
  selected: true
  summary: |
    Gait-classification models for five-gaited Icelandic horses built
    from accelerometer time series recorded by smartphones mounted on
    the horse. Uses LSTM and GRU architectures with attention to model
    size and on-device inference cost, showing that compact recurrent
    models reach near-expert accuracy without specialised hardware.
    Published in Animals (MDPI, 2023).
  summary_is: |
    Líkön til flokkunar gangtegunda íslenskra fimmgangshesta, byggð á
    tímaröðum úr hröðunarmælum snjallsíma sem festir eru á hestinn.
    Notaðir eru LSTM- og GRU-arkitektúrar með áherslu á stærð líkana og
    reiknikostnað við keyrslu í tækinu sjálfu, og sýnt að smá endurkvæm
    líkön ná nánast sömu nákvæmni og sérfræðingar án sérhæfðs vélbúnaðar.
    Birt í Animals (MDPI, 2023).

hamedpour2023analyzing:
  theme: cv-nat
  summary: |
    Conference abstract (EGU General Assembly 2023) analysing the effect
    of soil-warming duration on subarctic grasslands using high-resolution
    multispectral imagery from the ForHot experimental site in Iceland.
  summary_is: |
    Ráðstefnuágrip (EGU General Assembly 2023) sem greinir hvaða áhrif
    lengd jarðvegshlýnunar hefur á graslendi á norðurslóðum, með
    háupplausnar fjölrófsmyndum frá ForHot-tilraunasvæðinu á Íslandi.

sverrisson2023abstractive:
  theme: nlp-is
  summary: |
    Abstractive text summarization for Icelandic, exploring fine-tuning
    of multilingual sequence-to-sequence models on a constructed
    Icelandic news summarization corpus. NoDaLiDa 2023.
  summary_is: |
    Sjálfvirk samantekt íslensks texta með endursögn (abstractive
    summarization), þar sem könnuð er fínstilling fjöltyngdra
    runu-til-runu-líkana á nýrri íslenskri málheild fréttasamantekta.
    NoDaLiDa 2023.

fridhriksdottir2023effect:
  theme: nlp-is
  summary: |
    Studies how different input encodings affect relation-triplet
    identification, with experiments comparing flat-text and
    structure-aware representations. NoDaLiDa 2023.
  summary_is: |
    Kannar hvernig ólík kóðun inntaks hefur áhrif á greiningu
    venslaþrennda, með tilraunum þar sem framsetning sem flatur texti er
    borin saman við framsetningu sem tekur mið af formgerð. NoDaLiDa 2023.

skarphedinsson2023gameqa:
  theme: nlp-is
  summary: |
    Demos GameQA, a gamified mobile-app platform for collecting
    multiple-domain question-answering datasets from crowd participants.
    EACL 2023 System Demonstrations.
  summary_is: |
    Kynning á GameQA, farsímaforriti með leikjaívafi til að safna gögnum
    fyrir spurningasvörun á mörgum efnissviðum frá almennum þátttakendum.
    EACL 2023 System Demonstrations.

skarphedhinsson2022reykjavik:
  theme: nlp-is
  summary: |
    Release of RUQuAD-1 (version 22.02), the Reykjavik University
    Question-Answering Dataset for Icelandic - a SQuAD-style reading
    comprehension dataset collected through the GameQA mobile platform.
  summary_is: |
    Útgáfa RUQuAD-1 (22.02), spurningasvörunargagnasafns Háskólans í
    Reykjavík fyrir íslensku (Reykjavik University Question-Answering
    Dataset). Þetta er lesskilningsgagnasafn í anda SQuAD sem safnað var
    með GameQA-farsímaforritinu.

agnarsson2023epidemiology:
  theme: clinical-ai
  summary: |
    Conference abstract (European Heart Journal supplement) on the
    epidemiology of acute heart failure admissions in Iceland, examining
    phenotype distribution and prognostic implications using national
    registry data.
  summary_is: |
    Ráðstefnuágrip (fylgirit European Heart Journal) um faraldsfræði
    innlagna vegna bráðrar hjartabilunar á Íslandi, þar sem dreifing
    svipgerða og áhrif þeirra á horfur eru skoðuð út frá gögnum úr
    landsskrá.

einarsson2024application:
  theme: nlp-is
  selected: true
  summary: |
    Studies the use of ChatGPT for automated problem reframing in
    academic settings, where the same underlying task is rewritten as a
    series of alternative problem statements to support student
    learning and assessment design. Reports on prompting strategies,
    quality control, and human evaluation across multiple academic
    domains. First-author paper in Computers and Education: Artificial
    Intelligence; one of the early systematic studies of generative AI
    in higher-education problem authoring.
  summary_is: |
    Rannsakar notkun ChatGPT til að umorða verkefni sjálfvirkt í
    háskólakennslu, þar sem sama undirliggjandi verkefni er endurskrifað
    sem röð ólíkra verkefnalýsinga til að styðja við nám nemenda og gerð
    námsmats. Fjallað er um aðferðir við fyrirmælagerð, gæðaeftirlit og
    mat manna á mörgum fræðasviðum. Grein í Computers and Education:
    Artificial Intelligence (fyrsti höfundur); ein af fyrstu kerfisbundnu
    rannsóknunum á notkun skapandi gervigreindar við samningu verkefna í
    háskólum.
  links:
    doi: https://doi.org/10.1016/j.caeai.2023.100194

eggertsson2023effective:
  theme: nlp-is
  summary: |
    Examines effective entity disambiguation for low-resource languages
    through an Icelandic case study, comparing retrieval-based and
    encoder-based approaches. IEEE/WIC WI-IAT 2023.
  summary_is: |
    Skoðar skilvirka aðgreiningu nafnaeininga fyrir tungumál með lítil
    gögn, með íslensku sem dæmi, og ber saman aðferðir sem byggja á
    upplýsingaheimt og aðferðir sem byggja á kóðurum. IEEE/WIC WI-IAT
    2023.

thorolfsdottir2024variants:
  theme: genetics
  summary: |
    deCODE-style genome-wide association study linking variants at the
    interleukin 1 gene locus to pericarditis risk. JAMA Cardiology 2024.
  summary_is: |
    Víðtæk erfðamengisleit (GWAS) í anda deCODE sem tengir breytileika í
    genasæti interleukín 1 við áhættu á gollurshússbólgu. JAMA Cardiology
    2024.

arnardottir2024icelandic:
  theme: nlp-is
  summary: |
    Adapts the GPT-SW3 family of generative language models for
    Icelandic spell- and grammar-checking, including dataset construction
    and a fine-tuning protocol. Released by Miðeind ehf.
  summary_is: |
    Aðlagar GPT-SW3-fjölskyldu skapandi mállíkana að stafsetningar- og
    málfarsleiðréttingu á íslensku og lýsir m.a. smíði gagnasafns og
    verklagi við fínstillingu. Gefið út af Miðeind ehf.

fridhriksdottir2024gendered:
  theme: nlp-is
  selected: true
  summary: |
    Investigates whether observed gender bias in Icelandic language
    models reflects grammatical gender or socially ingrained bias.
    Designs probing tasks that disentangle grammatical agreement from
    stereotypical role associations, and evaluates several open-source
    Icelandic LMs (including the IceBERT and GPT-SW3 lines). Finds
    consistent stereotype-aligned bias beyond what grammar predicts.
    LREC-COLING 2024.
  summary_is: |
    Kannar hvort kynjaskekkja sem mælist í íslenskum mállíkönum
    endurspegli málfræðilegt kyn eða samfélagslega rótgróna hlutdrægni.
    Hannar könnunarverkefni sem greina málfræðilegt samræmi frá
    staðalmyndum um hlutverk og metur nokkur opin íslensk mállíkön (þ.á m.
    IceBERT- og GPT-SW3-línurnar). Niðurstöður sýna stöðuga skekkju í átt
    að staðalmyndum, umfram það sem málfræðin segir til um. LREC-COLING
    2024.
  links:
    pdf: https://aclanthology.org/2024.lrec-main.671/

debess2024good:
  theme: nlp-is
  summary: |
    Evaluates GPT-4 for Faroese sentiment analysis on a public news
    corpus, comparing prompting strategies and human judgement.
    LREC-COLING 2024.
  summary_is: |
    Metur GPT-4 til lyndisgreiningar á færeysku á opinni fréttamálheild,
    ber saman ólíkar aðferðir við fyrirmælagerð og ber niðurstöðurnar
    saman við mat manna. LREC-COLING 2024.

arnardottir2024beyond:
  theme: nlp-is
  summary: |
    Proposes a contextual evaluation methodology for emerging spell- and
    grammar-checkers that goes beyond fixed error categories, applied to
    Icelandic systems. SIGUL workshop at LREC-COLING 2024.
  summary_is: |
    Setur fram samhengisbundna matsaðferð fyrir nýleg leiðréttingarkerfi
    fyrir stafsetningu og málfar, sem nær lengra en fastir villuflokkar,
    og beitir henni á íslensk kerfi. SIGUL-vinnustofan á LREC-COLING 2024.

fridhriksdottir2024ice:
  theme: nlp-is
  summary: |
    Introduces Ice and Fire, a dataset of Icelandic blog comments
    annotated for sentiment, emotions, toxicity, sarcasm, hate speech,
    sympathy, and related labels. Workshop on Threat, Aggression &
    Cyberbullying at LREC-COLING 2024.
  summary_is: |
    Kynnir Ice and Fire, gagnasafn íslenskra bloggathugasemda sem merktar
    eru með tilliti til lyndis, tilfinninga, eitraðrar orðræðu, kaldhæðni,
    hatursorðræðu, samúðar og skyldra þátta. Workshop on Threat,
    Aggression & Cyberbullying á LREC-COLING 2024.

hauksson2024applications:
  theme: clinical-ai
  selected: true
  summary: |
    Applies BERT-style models to automate ICD-10 clinical coding in
    Icelandic hospital records, treating coding as a hierarchical
    multi-label classification problem. Combines an Icelandic clinical
    pre-training corpus with multi-task fine-tuning and reports
    substantial improvements over rule-based and shallow-classifier
    baselines. The work was awarded the University of Iceland Science
    Award. Published in Findings of NAACL 2024.
  summary_is: |
    Beitir líkönum af BERT-gerð til að sjálfvirknivæða ICD-10-kóðun
    sjúkdómsgreininga í íslenskum sjúkraskrám, þar sem kóðunin er
    meðhöndluð sem stigveldisbundin fjölmerkjaflokkun. Sameinar íslenska
    klíníska málheild til forþjálfunar og fínstillingu á mörgum verkefnum
    samtímis, og sýnir verulegar framfarir miðað við reglubyggð kerfi og
    grunnlíkön með einfaldari flokkurum. Verkið hlaut vísindaverðlaun
    Háskóla Íslands. Birt í Findings of NAACL 2024.
  links:
    pdf: https://aclanthology.org/2024.findings-naacl.124/

ingimarsdottir2024icelandic:
  theme: clinical-ai
  summary: |
    Describes the Icelandic Heart Failure Registry as a nationwide tool
    for assessing heart-failure care and tracking treatment
    interventions. ESC Heart Failure.
  summary_is: |
    Lýsir íslensku hjartabilunarskránni sem verkfæri á landsvísu til að
    meta meðferð hjartabilunar og fylgjast með meðferðarinngripum. ESC
    Heart Failure.

saldarriaga2024diagnostic:
  theme: clinical-ai
  summary: |
    Co-authored international survey of diagnostic and therapeutic
    practice for heart failure with preserved ejection fraction (HFpEF),
    contributing the Icelandic Heart Failure Registry data. Current
    Problems in Cardiology / EJHF (a related conference abstract shares
    the same citation key).
  summary_is: |
    Alþjóðleg samstarfskönnun á greiningar- og meðferðarvenjum við
    hjartabilun með varðveitt útfallsbrot (HFpEF), með gögnum úr íslensku
    hjartabilunarskránni sem framlagi Íslands. Current Problems in
    Cardiology / EJHF (tengt ráðstefnuágrip deilir sama tilvísunarlykli).

guidetti2025differences:
  theme: clinical-ai
  summary: |
    Co-authored international survey on differences in HFpEF management
    between care providers, contributing the Icelandic Heart Failure
    Registry data. European Journal of Heart Failure.
  summary_is: |
    Alþjóðleg samstarfskönnun á mun á meðferð HFpEF eftir meðferðaraðilum,
    með gögnum úr íslensku hjartabilunarskránni sem framlagi Íslands.
    European Journal of Heart Failure.

sigurdhardottir2024sequence:
  theme: cv-nat
  summary: |
    Multispectral-imaging pipeline for sequence segmentation of nematode
    parasites in Atlantic cod fillets, intended for industrial quality
    control. Foods (MDPI).
  summary_is: |
    Ferli byggt á fjölrófsmyndgreiningu til runuhlutunar á sníkjuþráðormum
    í þorskflökum, ætlað til gæðaeftirlits í iðnaði. Foods (MDPI).

simonsen2024human:
  theme: nlp-is
  summary: |
    Human-centred analysis of GPT-4 translations between Faroese and
    English, evaluating news and blog texts with native speakers.
    EAMT 2024.
  summary_is: |
    Mannmiðuð greining á þýðingum GPT-4 milli færeysku og ensku, þar sem
    móðurmálshafar meta frétta- og bloggtexta. EAMT 2024.

ingimarsdottir2025diagnostic:
  theme: clinical-ai
  summary: |
    Journal version of the international HFpEF practice survey, with
    the Icelandic Heart Failure Registry providing one of the national
    data contributions. ESC Heart Failure.
  summary_is: |
    Tímaritsútgáfa alþjóðlegu könnunarinnar á meðferðarvenjum við HFpEF,
    þar sem íslenska hjartabilunarskráin er meðal gagnaframlaga einstakra
    landa. ESC Heart Failure.

einarsson2024icelandic:
  theme: nlp-is
  summary: |
    Release of the Icelandic Sentiment Corpus "Hotter and Colder",
    annotated for nuanced sentiment and adjacent labels in Icelandic
    blog comments. Distributed via the University of Iceland.
  summary_is: |
    Útgáfa íslensku lyndismálheildarinnar „Hotter and Colder“, sem
    samanstendur af íslenskum bloggathugasemdum merktum með blæbrigðaríku
    lyndi og skyldum þáttum. Dreift af Háskóla Íslands.

einarsson2024sequence:
  theme: genetics
  summary: |
    deCODE-led genome-wide study (Nature Communications 2024) showing
    that sequence variants associated with body mass index influence
    downstream disease risk primarily through BMI itself, rather than
    via independent pleiotropic effects. Uses Mendelian-randomisation
    and stratified-association analyses across the Icelandic
    population. Among the few Nature Communications papers in the
    collection.
  summary_is: |
    Erfðamengisrannsókn undir forystu deCODE (Nature Communications 2024)
    sem sýnir að raðbreytileikar sem tengjast líkamsþyngdarstuðli (BMI)
    hafa áhrif á áhættu á afleiddum sjúkdómum fyrst og fremst í gegnum
    BMI-gildið sjálft, fremur en með óháðum fjölvirkniáhrifum. Beitt er
    mendelskri slembiröðun og lagskiptum tengslagreiningum á íslensku
    þjóðinni. Ein fárra greina í Nature Communications í safninu.
  links:
    doi: https://doi.org/10.1038/s41467-024-53568-9

kristjansdottir2024improving:
  theme: nlp-is
  summary: |
    Improves phrase-structure parsing for Icelandic with neural
    architectures and additional training data. University of Iceland
    technical report / preprint.
  summary_is: |
    Bætir liðgerðarþáttun (phrase-structure parsing) fyrir íslensku með
    tauganetsarkitektúrum og auknum þjálfunargögnum. Tækniskýrsla /
    forprent frá Háskóla Íslands.

gunnthorsdottir2025factors:
  theme: clinical-ai
  summary: |
    Survey study of factors that cardiac healthcare providers believe
    influence medication adherence in heart-failure patients. Clinical
    Pharmacology & Therapeutics.
  summary_is: |
    Spurningakönnun um þá þætti sem heilbrigðisstarfsfólk í
    hjartalækningum telur hafa áhrif á lyfjaheldni sjúklinga með
    hjartabilun. Clinical Pharmacology & Therapeutics.

bergmann2025unravelling:
  theme: clinical-ai
  summary: |
    Nationwide epidemiological study of ATTR cardiac amyloidosis in
    Iceland, leveraging the Icelandic Heart Failure Registry to estimate
    prevalence and characterise the patient population. Cardiology
    journal (Karger).
  summary_is: |
    Faraldsfræðileg rannsókn á landsvísu á ATTR-mýlildi í hjarta á
    Íslandi, þar sem íslenska hjartabilunarskráin er nýtt til að meta
    algengi og lýsa sjúklingahópnum. Tímaritið Cardiology (Karger).

simonsen2025foqa:
  theme: nlp-is
  selected: true
  summary: |
    Introduces FoQA, the first dedicated question-answering dataset for
    Faroese, with extractive and generative variants. The dataset is
    constructed via translation and adaptation of existing QA
    benchmarks combined with native-speaker validation, and is
    accompanied by baseline evaluations of multilingual and Faroese-
    tuned language models. Establishes a reference benchmark for
    Faroese reading comprehension. RESOURCEFUL 2025 (NoDaLiDa
    co-located workshop).
  summary_is: |
    Kynnir FoQA, fyrsta sérhæfða gagnasafnið fyrir spurningasvörun á
    færeysku, bæði í útdráttar- og myndunarútgáfu. Gagnasafnið er unnið
    með þýðingu og aðlögun fyrirliggjandi prófsafna fyrir spurningasvörun
    ásamt yfirferð móðurmálshafa, og því fylgja grunnmælingar á
    fjöltyngdum mállíkönum og líkönum sem aðlöguð hafa verið að færeysku.
    Myndar viðmiðunarprófsafn fyrir lesskilning á færeysku. RESOURCEFUL
    2025 (vinnustofa haldin samhliða NoDaLiDa).
  links:
    pdf: https://aclanthology.org/2025.resourceful-1.7/

fridhriksdottir2025hotter:
  theme: nlp-is
  summary: |
    Companion paper for the Hotter and Colder Icelandic sentiment
    dataset, describing the annotation methodology for sentiment,
    emotions, and bias in Icelandic blog comments. NoDaLiDa / Baltic-HLT
    2025.
  summary_is: |
    Fylgigrein með íslenska lyndisgagnasafninu Hotter and Colder, sem
    lýsir aðferðafræðinni við merkingu lyndis, tilfinninga og hlutdrægni í
    íslenskum bloggathugasemdum. NoDaLiDa / Baltic-HLT 2025.

hauksdottir2024real:
  theme: clinical-ai
  summary: |
    Conference abstract (EJHF) evaluating real-life medication
    optimisation in heart-failure patients across different phenotypes,
    using the Icelandic Heart Failure Registry.
  summary_is: |
    Ráðstefnuágrip (EJHF) sem metur hvernig gengur að hámarka lyfjameðferð
    sjúklinga með hjartabilun í klínísku starfi, eftir svipgerðum, með
    gögnum úr íslensku hjartabilunarskránni.

gunnarsson2023acute:
  theme: clinical-ai
  summary: |
    Conference abstract (ESC Heart Failure 2023) on causes and outcomes
    of acute heart failure stratified by chronic kidney disease stage
    and heart-failure phenotype, using the Icelandic Heart Failure
    Registry.
  summary_is: |
    Ráðstefnuágrip (ESC Heart Failure 2023) um orsakir og afdrif bráðrar
    hjartabilunar, greint eftir stigi langvinns nýrnasjúkdóms og svipgerð
    hjartabilunar, með gögnum úr íslensku hjartabilunarskránni.

ingimarsdottir2024diagnostic:
  theme: clinical-ai
  summary: |
    Conference abstract (EJHF) of the international HFpEF practice
    survey contributing Icelandic registry data.
  summary_is: |
    Ráðstefnuágrip (EJHF) um alþjóðlegu könnunina á meðferðarvenjum við
    HFpEF, þar sem íslensk skrárgögn eru meðal framlaga.

gunnthorsdottir2024factors:
  theme: clinical-ai
  summary: |
    Conference abstract (EJHF) on factors believed by cardiac care
    professionals to influence medication adherence in heart failure
    patients.
  summary_is: |
    Ráðstefnuágrip (EJHF) um þá þætti sem heilbrigðisstarfsfólk í
    hjartalækningum telur hafa áhrif á lyfjaheldni sjúklinga með
    hjartabilun.

hrolfsdottir2025multispectral:
  theme: cv-nat
  summary: |
    Uses multispectral imaging to evaluate physicochemical, antioxidant,
    and sensory properties of the brown algae Alaria esculenta and
    Saccharina latissima. Algal Research.
  summary_is: |
    Notar fjölrófsmyndgreiningu til að meta eðlis- og efnafræðilega
    eiginleika, andoxunarvirkni og skynræna eiginleika brúnþörunganna
    Alaria esculenta (marinkjarna) og Saccharina latissima (beltisþara).
    Algal Research.

einarsson2025proceedings:
  theme: nlp-is
  summary: |
    Edited proceedings of the 1st Workshop on Nordic-Baltic Responsible
    Evaluation and Alignment of Language Models (NB-REAL 2025),
    co-located with NoDaLiDa/Baltic-HLT 2025.
  summary_is: |
    Ritstýrt ráðstefnurit vinnustofunnar 1st Workshop on Nordic-Baltic
    Responsible Evaluation and Alignment of Language Models (NB-REAL
    2025), sem haldin var samhliða NoDaLiDa/Baltic-HLT 2025.

scalvini2025rethinking:
  theme: nlp-is
  summary: |
    Argues that fine-tuned multilingual NMT models remain surprisingly
    competitive with large LLMs on low-resource translation, with
    experiments on Faroese. NoDaLiDa / Baltic-HLT 2025.
  summary_is: |
    Færir rök fyrir því að fínstillt fjöltyngd tauganetslíkön fyrir
    vélþýðingu (NMT) standist enn furðuvel samanburð við stór mállíkön í
    þýðingum á tungumálum með lítil gögn, með tilraunum á færeysku.
    NoDaLiDa / Baltic-HLT 2025.

arnardottir2025wikiqa:
  theme: nlp-is
  summary: |
    Introduces WikiQA-IS, an LLM-assisted benchmark for evaluating
    Icelandic cultural knowledge in language models, with automated
    evaluation protocols. RESOURCEFUL 2025.
  summary_is: |
    Kynnir WikiQA-IS, prófsafn sem smíðað var með aðstoð stórra mállíkana
    til að meta þekkingu mállíkana á íslenskri menningu, ásamt sjálfvirku
    matsferli. RESOURCEFUL 2025.

scalvini2025prompt:
  theme: nlp-is
  summary: |
    Shows that prompt engineering yields measurable improvements in
    Faroese machine translation, but that automatic metrics fail to
    capture them - human evaluation is required. NoDaLiDa / Baltic-HLT
    2025.
  summary_is: |
    Sýnir að fyrirmælagerð skilar mælanlegum framförum í vélþýðingu á
    færeysku en að sjálfvirkir mælikvarðar nái ekki að fanga þær; mat
    manna er nauðsynlegt. NoDaLiDa / Baltic-HLT 2025.

sigurdhardottir2025multispectral:
  theme: cv-nat
  summary: |
    Multispectral-imaging method for predicting freshness of whole
    Atlantic cod, validated against sensory, chemical, and microbiological
    reference analyses. Applied Food Research.
  summary_is: |
    Aðferð byggð á fjölrófsmyndgreiningu til að spá fyrir um ferskleika
    heils þorsks, sannreynd með skynmati og efna- og örverufræðilegum
    viðmiðunargreiningum. Applied Food Research.

einarsson2022bootstrapping:
  theme: nlp-is
  summary: |
    Proposes bootstrapping techniques for building Icelandic knowledge-
    graph data from text, presented at the ESSLLI 2022 student session.
  summary_is: |
    Leggur til aðferðir byggðar á bootstrapping til að smíða íslensk
    þekkingarnetsgögn úr texta; kynnt á nemendamálstofu ESSLLI 2022.

hamedpour2022drought:
  theme: cv-nat
  summary: |
    Conference paper analysing drought response in a geothermally warmed
    subarctic grassland using multispectral drone imagery, from the
    ForHot site in Iceland. 16th International Circumpolar Remote
    Sensing Symposium.
  summary_is: |
    Ráðstefnugrein sem greinir viðbrögð við þurrki í graslendi á
    norðurslóðum sem hlýnað hefur vegna jarðhita, með fjölrófsmyndum
    teknum með dróna á ForHot-svæðinu á Íslandi. 16th International
    Circumpolar Remote Sensing Symposium.

einarsson2025mazeeval:
  theme: nlp-is
  selected: true
  summary: |
    MazeEval is a benchmark for testing sequential decision-making in
    language models through navigation tasks in procedurally generated
    mazes. The setup probes whether models can maintain a coherent
    internal map across multiple turns of interaction rather than
    relying on local pattern matching. Single-author paper published at
    LREC 2026.
  summary_is: |
    MazeEval er prófsafn til að meta raðbundna ákvarðanatöku mállíkana með
    rötunarverkefnum í völundarhúsum sem búin eru til með reikniriti.
    Uppsetningin kannar hvort líkönin geti viðhaldið samræmdu innra korti
    yfir margar umferðir samskipta í stað þess að reiða sig á staðbundna
    mynsturpörun. Grein með einum höfundi, birt á LREC 2026.
  links:
    doi: https://doi.org/10.63317/4nm93hckcaf2
    pdf: https://lrec.elra.info/lrec2026-main-027
    arxiv: https://arxiv.org/abs/2507.20395

da2025temporal:
  theme: cv-nat
  selected: true
  summary: |
    Aggregates temporal vision-language features from underwater video
    to classify fish species in automated monitoring streams,
    combining per-frame embeddings with temporal pooling to handle the
    noise and occlusion that limit frame-by-frame classifiers in
    deployed systems. Published in Ecological Informatics (2025) as
    part of the lab's ongoing computer-vision work with the Marine
    and Freshwater Research Institute.
  summary_is: |
    Safnar saman eiginleikum úr mynd- og mállíkönum (vision-language) yfir
    tíma í neðansjávarmyndböndum til að flokka fisktegundir í sjálfvirkri
    vöktun. Vigurframsetningar einstakra ramma eru sameinaðar með
    tímasöfnun (temporal pooling) til að ráða við suð og byrgingu sem
    takmarka flokkara sem vinna ramma fyrir ramma í kerfum í rekstri. Birt
    í Ecological Informatics (2025) sem hluti af áframhaldandi
    tölvusjónarsamstarfi rannsóknarhópsins við Hafrannsóknastofnun.
  links:
    doi: https://doi.org/10.1016/j.ecoinf.2025.103462

chang2025global:
  theme: nlp-is
  summary: |
    Co-authored contribution (Icelandic subset) to Global PIQA, a
    physical-commonsense reasoning benchmark spanning 100+ languages
    and cultures. arXiv preprint.
  summary_is: |
    Meðhöfundarframlag (íslenski hlutinn) að Global PIQA, prófsafni fyrir
    ályktanir byggðar á almennri þekkingu á efnisheiminum sem nær til yfir
    100 tungumála og menningarheima. Forprent á arXiv.
  links:
    arxiv: https://arxiv.org/abs/2510.24081

einarsson2026curated:
  theme: nlp-is
  selected: true
  summary: |
    A pre-launch expert evaluation of Evrópuvefur, a government-funded
    University of Iceland service that answers questions about the
    European Union, conducted as Iceland prepared for its August 2026
    referendum on resuming EU accession talks. Five domain experts
    produced 551 evaluations of 449 AI-generated answers, comparing a
    curated local corpus (RAG) against open web search: web search
    answered more questions but flagged an untrustworthy or irrelevant
    source in 35% of answers, while the curated corpus was trustworthy
    yet limited in coverage. Argues that source trustworthiness is a
    measurable but largely invisible dimension of information quality
    in public AI services. First-author arXiv preprint.
  summary_is: |
    Sérfræðimat á Evrópuvefnum áður en hann var opnaður, en hann er
    þjónusta Háskóla Íslands, fjármögnuð af stjórnvöldum, sem svarar
    spurningum um Evrópusambandið. Matið fór fram þegar Ísland bjó sig
    undir þjóðaratkvæðagreiðslu í ágúst 2026 um að taka upp
    aðildarviðræður við ESB að nýju. Fimm sérfræðingar á sviðinu skiluðu
    551 mati á 449 svörum sem gervigreind samdi, þar sem sérvalið innlent
    heimildasafn (RAG) var borið saman við opna vefleit: vefleitin svaraði
    fleiri spurningum en í 35% svara var bent á ótrausta eða óviðkomandi
    heimild, á meðan sérvalda heimildasafnið reyndist traust en takmarkað
    að umfangi. Færir rök fyrir því að áreiðanleiki heimilda sé mælanleg
    en að mestu ósýnileg vídd upplýsingagæða í opinberri
    gervigreindarþjónustu. Forprent á arXiv (fyrsti höfundur).
  links:
    arxiv: https://arxiv.org/abs/2607.05217

gudjonsson2025survival:
  theme: clinical-ai
  summary: |
    Conference abstract (European Heart Journal supplement) examining
    the survival impact of amiodarone therapy in heart-failure patients
    using the Icelandic Heart Failure Registry.
  summary_is: |
    Ráðstefnuágrip (fylgirit European Heart Journal) sem skoðar áhrif
    amíódarónmeðferðar á lifun sjúklinga með hjartabilun, með gögnum úr
    íslensku hjartabilunarskránni.

einarsson2025variant:
  theme: genetics
  summary: |
    deCODE-led study linking a variant at a taste-receptor locus to
    changes in the use of insomnia medication. Biological Psychiatry
    Global Open Science.
  summary_is: |
    Rannsókn undir forystu deCODE sem tengir breytileika í genasæti
    bragðviðtaka við breytingar á notkun lyfja við svefnleysi. Biological
    Psychiatry Global Open Science.

schram2025teachers:
  theme: nlp-is
  summary: |
    Survey study of teachers' attitudes and perceptions of AI usefulness
    in academia, asking how universities should respond to a changing
    educational landscape. ICERI 2025 proceedings.
  summary_is: |
    Spurningakönnun um viðhorf kennara og mat þeirra á gagnsemi
    gervigreindar í háskólastarfi, þar sem spurt er hvernig háskólar eigi
    að bregðast við breyttu landslagi menntunar. Ráðstefnurit ICERI 2025.

schram2025askoranir:
  theme: nlp-is
  summary: |
    Icelandic-language companion to the ICERI 2025 paper - a preliminary
    study of University of Iceland teachers' attitudes and experience
    with generative AI in higher education. Menntakvika 2025.
  summary_is: |
    Íslensk fylgigrein við ICERI 2025-greinina: frumrannsókn á viðhorfum
    kennara við Háskóla Íslands til skapandi gervigreindar í
    háskólakennslu og reynslu þeirra af henni. Menntakvika 2025.

ingimarsdottir2026impact:
  theme: clinical-ai
  summary: |
    International survey of how country income level affects HFpEF
    management practice, with the Icelandic Heart Failure Registry as
    one of the national data sources. ESC Heart Failure.
  summary_is: |
    Alþjóðleg könnun á því hvernig tekjustig landa hefur áhrif á
    meðferðarvenjur við HFpEF, þar sem íslenska hjartabilunarskráin er ein
    af gagnalindum einstakra landa. ESC Heart Failure.

myhre2026enhancing:
  theme: clinical-ai
  summary: |
    Nordic-cohort study of how national heart-failure registries can
    enhance guideline-directed care, with contributions from the
    Icelandic Heart Failure Registry. European Journal of Heart Failure.
  summary_is: |
    Rannsókn á norrænum sjúklingahópum um hvernig hjartabilunarskrár
    einstakra landa geta stuðlað að meðferð samkvæmt klínískum
    leiðbeiningum, með framlagi frá íslensku hjartabilunarskránni.
    European Journal of Heart Failure.

