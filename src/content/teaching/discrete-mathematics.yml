title: Discrete Mathematics for Computer Science
level: bsc
language: mixed
semesters:
  - Fall 2020
  - Fall 2021
  - Fall 2022
  - Fall 2023
description: >-
  First-year course covering the discrete-math foundations used
  throughout the rest of the computer-science degree: propositions
  and predicate logic, set theory and Boolean algebra, induction and
  recursion, counting and basic algorithm analysis, relations and
  their representations, trees and graphs, and the basics of strings,
  finite automata, and formal grammars. Enrolment runs 200–230
  students per cohort, a mix of Icelandic and international students.
title_is: "Strjál stærðfræði fyrir tölvunarfræði"
description_is: >-
  Námskeið á fyrsta ári sem fer yfir þann grunn í strjálli stærðfræði
  sem byggt er á í öllu tölvunarfræðináminu: yrðinga- og
  umsagnarökfræði, mengjafræði og Boole-algebru, þrepun og
  endurkvæmni, talningu og einfalda greiningu reiknirita, vensl og
  framsetningu þeirra, tré og net og grunnatriði strengja, stöðuvéla
  og formlegra mállýsinga. Í hverjum árgangi eru 200–230 nemendur,
  bæði íslenskir og erlendir.
