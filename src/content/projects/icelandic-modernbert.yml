name: Icelandic ModernBERT
summary: >-
  ModernBERT encoders for Icelandic from 12M to 1B parameters, trained on
  9B tokens of open data: a size ladder trained from scratch and the
  models from the warm-start study, 34 in all under the MIT licence. The
  1B model, to our knowledge the first monolingual Icelandic encoder of
  that size, is significantly better than IceBERT on all eleven benchmark
  tasks. Released alongside the 2026 arXiv preprint.
links:
