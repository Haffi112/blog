date: 2024-05-20
text: "Three papers at LREC-COLING 2024 and its workshops in Turin, including a study of gender bias in Icelandic language models and GPT-4 sentiment analysis for Faroese."
text_is: "Þrjár greinar á LREC-COLING 2024 og vinnustofum hennar í Tórínó, meðal annars rannsókn á kynjaskekkju í íslenskum mállíkönum og lyndisgreiningu á færeysku með GPT-4."
