title: Computers, Operating Systems and Digital Literacy
level: bsc
language: mixed
semesters: []
description: >-
  Self-study BSc course developed in 2020 and modelled on MIT's
  "Missing Semester of your CS Education". Covers computer
  organisation, operating-systems basics, and the command-line and
  tooling skills students need across the rest of the degree.
  Designed for both Icelandic and international students to work
  through at their own pace.
title_is: "Tölvur, stýrikerfi og stafrænt læsi"
description_is: >-
  Sjálfsnámsnámskeið í grunnnámi sem ég byggði upp árið 2020 að
  fyrirmynd „The Missing Semester of Your CS Education“ frá MIT.
  Fjallað er um uppbyggingu tölva, grunnatriði stýrikerfa og þá færni
  á skipanalínu og með verkfæri sem nemendur þurfa í gegnum allt
  námið. Námskeiðið er hannað bæði fyrir íslenska og erlenda nemendur
  sem fara í gegnum efnið á eigin hraða.
