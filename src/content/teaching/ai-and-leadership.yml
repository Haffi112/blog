title: AI and Leadership
level: msc
language: icelandic
semesters:
  - "2025"
  - "2026"
description: >-
  Course in the Executive MBA programme at the University of Iceland
  that introduces leaders to the fundamentals of AI alongside the
  leadership practice of using it well. Topics include what current
  models can and cannot do, opportunities for leaders to apply AI to
  data, decision-making, employee performance and well-being, and the
  ethical questions that come with deploying it in a business. The
  course is hands-on: participants work directly with generative AI
  tools and critically assess their fit for real leadership
  challenges. Co-taught in 2025 with Sigrún Gunnarsdóttir, whose
  expertise is in servant leadership; taught solo in 2026. In
  Icelandic.
