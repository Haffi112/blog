title: Large Language Models in an Icelandic Context
level: msc
language: icelandic
semesters:
  - Spring 2026
description: >-
  Master's course at the School of Humanities asking how well large
  language models work in Icelandic and what their behaviour says
  about both the models and human language. Topics include methods
  for evaluating LLM linguistic competence in Icelandic, the risks
  that come with widespread chatbot use in smaller language
  communities (misinformation, bias and prejudice), and what
  cross-linguistic performance suggests about the way children and
  machines acquire language. Lead instructor: Iris Edda Nowenstein.
  Taught in Icelandic.
title_is: "Risamállíkön í íslensku samhengi"
description_is: >-
  Meistaranámskeið á Hugvísindasviði þar sem spurt er hversu vel
  risamállíkön virka á íslensku og hvað hegðun þeirra segir okkur bæði
  um líkönin og mannlegt mál. Meðal efnis eru aðferðir til að meta
  málfærni risamállíkana á íslensku, áhættan sem fylgir útbreiddri
  notkun spjallmenna í litlum málsamfélögum (rangfærslur, bjögun og
  fordómar) og hvað frammistaða líkananna á ólíkum tungumálum gefur
  til kynna um það hvernig börn og vélar tileinka sér mál.
  Umsjónarkennari: Iris Edda Nowenstein. Kennt á íslensku.
