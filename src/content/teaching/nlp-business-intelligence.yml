title: Natural Language Processing (Business Intelligence module)
level: msc
language: english
semesters:
  - Spring 2022
  - Spring 2023
  - Spring 2024
description: >-
  Two-week module on natural language processing taught inside the
  Business Intelligence master's course at the School of Business,
  where Helga Ingimundardóttir is the lead instructor. The module
  covers text preprocessing, embeddings, classification, named-entity
  recognition, and the use of large language models in analyst
  workflows. Taught in English.
title_is: "Máltækni (hluti af námskeiðinu Viðskiptagreind)"
description_is: >-
  Tveggja vikna hluti um máltækni innan meistaranámskeiðsins
  Viðskiptagreind við Viðskiptafræðideild, þar sem Helga
  Ingimundardóttir er umsjónarkennari. Fjallað er um forvinnslu texta,
  greypingar, flokkun, nafnakennsl og notkun risamállíkana í starfi
  greinenda. Kennt á ensku.
