date: 2020-01-01
text: "Prescriby, the company I co-founded, received Sproti and Vöxtur grants from the Technology Development Fund, about 90 million ISK in total."
text_is: "Prescriby, fyrirtækið sem ég stofnaði ásamt öðrum, hlaut Sprota- og Vaxtarstyrki úr Tækniþróunarsjóði, samtals um 90 milljónir króna."
