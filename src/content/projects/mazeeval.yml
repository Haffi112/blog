name: MazeEval
summary: >-
  A benchmark for testing sequential decision-making in language models
  through navigation tasks in procedurally generated mazes. Single-author
  preprint with the benchmark released alongside the paper.
links:
  site: https://arxiv.org/abs/2507.20395
tags:
  - benchmark
  - language-model
status: active
summary_is: >-
  Prófsafn sem kannar raðbundna ákvarðanatöku mállíkana með
  rötunarverkefnum í völundarhúsum sem eru búin til sjálfvirkt.
  Forprent sem ég skrifaði einn, og prófsafnið kom út með greininni.
